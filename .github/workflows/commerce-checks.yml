name: Commerce checks
on:
  push:
    branches: [main]
    paths: ['backend/**', 'src/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sole_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: sole_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sole_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sole_test:ephemeral_ci_only@localhost:5432/sole_test
      DEBUG: 'true'
      STRIPE_CHECKOUT_ENABLED: 'false'
      LIVE_COMMERCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Python dependencies
        run: python3.12 -m pip install -r backend/requirements.lock
      - name: PostgreSQL migrations, payment safety and concurrency
        working-directory: backend
        run: |
          python3.12 manage.py check
          python3.12 manage.py makemigrations --check --dry-run
          python3.12 manage.py test --noinput --verbosity 2
      - name: Frontend build and hosting checks
        run: |
          npm ci
          npm run build
          npm run test:sites
