services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sole_district
      POSTGRES_USER: sole_district
      POSTGRES_PASSWORD: local_only_change_me
    volumes:
      - sole-district-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sole_district -d sole_district"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://sole_district:local_only_change_me@db:5432/sole_district
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_ORIGIN: http://localhost:5173
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_catalog && python manage.py bootstrap_roles && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24
    working_dir: /app
    restart: unless-stopped
    environment:
      DJANGO_API_ORIGIN: http://backend:8000
    volumes:
      - .:/app
      - sole-district-node-modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sole-district-postgres:
  sole-district-node-modules:
